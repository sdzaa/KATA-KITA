<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KATA-KITA</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/translations.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
            font-weight: 600;
        }

        .split-container {
            display: flex;
            width: 100%;
            height: 100vh;
            background-color: #f7f8fa;
        }

        /* Left Side Illustration */
        .illustration-side {
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #f0f2f5;
        }

        .illustration-side img {
            max-width: 80%;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.05));
        }

        /* Right Side Form */
        .form-side {
            flex: 1;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.02);
            transition: all 0.4s ease;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            text-align: left;
        }

        .welcome-text {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .brand-name {
            font-size: 3.5rem;
            color: var(--color-primary);
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: -2px;
            text-transform: uppercase;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        /* Input Styles */
        .input-group {
            margin-bottom: 24px;
            background: #f1f1f1;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .input-group:focus-within {
            background: white;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(233, 59, 129, 0.1);
        }

        .input-group label {
            font-size: 0.75rem;
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-group input {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
            width: 100%;
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(233, 59, 129, 0.2);
            position: relative;
        }

        .login-btn:hover {
            background-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(233, 59, 129, 0.3);
        }

        .login-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .link-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            color: #666;
        }

        .link-text a {
            color: var(--color-primary);
            font-weight: 700;
            text-decoration: none;
        }

        .link-text a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #E53E3E;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }

        @media (max-width: 900px) {
            .illustration-side {
                display: none;
            }

            .form-side {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="split-container">
        <!-- Left Side: Illustration -->
        <div class="illustration-side">
            <img src="../images/logo-only.png" alt="KATA-KITA Illustration" style="max-width: 60%; height: auto;">
        </div>

        <!-- Right Side: Form -->
        <div class="form-side">
            <div class="login-card animate-fade-in">
                <h2 class="welcome-text">Join</h2>
                <h1 class="brand-name">KATA-KITA</h1>
                <p class="subtitle">Create an account to track your journey.</p>

                <form id="signupForm" style="margin-top: 24px;">
                    <div class="input-group">
                        <label for="username">Nickname</label>
                        <input type="text" id="username" placeholder="Choose a nickname" required autocomplete="off">
                    </div>
                    <!-- New Display Name Field -->
                    <div class="input-group" style="margin-top: 16px;">
                        <label for="display_name">Display Name</label>
                        <input type="text" id="display_name" placeholder="Enter display name" required autocomplete="off">
                    </div>
                    <div class="input-group" style="margin-top: 16px;">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
                    </div>
                    <div class="input-group" style="margin-top: 16px;">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" placeholder="Confirm your password" required autocomplete="new-password">
                    </div>
                    
                    <div id="errorMessage" class="error-message">Passwords do not match.</div>

                    <button type="submit" id="submitBtn" class="login-btn" style="margin-top: 24px;">Sign Up</button>
                    
                    <div class="link-text">
                        Already have an account? <a href="../index.html">Log In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/signup.js"></script>
<script src="../js/api.js"></script>
</body>

</html>
