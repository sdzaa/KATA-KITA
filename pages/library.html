    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.querySelector('.library-grid');
            if (!grid) return;

            grid.innerHTML = '<p style="text-align: center; color: var(--color-text-muted); grid-column: 1 / -1; padding: 40px;">Loading articles...</p>';

            if (typeof KatakitaAPI === 'undefined') {
                grid.innerHTML = '<p style="text-align: center; color: var(--color-text-muted); grid-column: 1 / -1; padding: 40px;">API not available.</p>';
                return;
            }

            KatakitaAPI.request('get_data', { tables: ['education'] })
                .then(response => {
                    if (response && response.result === 'success' && response.data && response.data.education) {
                        const articles = response.data.education;
                        if (articles.length === 0) {
                            grid.innerHTML = '<p style="text-align: center; color: var(--color-text-muted); grid-column: 1 / -1; padding: 40px;">No articles available.</p>';
                            return;
                        }

                        grid.innerHTML = '';

                        // Process each article
                        articles.forEach((art, index) => {
                            const needsMetadata = !art.title || !art.summary;
                            
                            // Workaround for Google Sheet column misalignment where URL might be in image_url
                            let actualUrl = art.url;
                            if (!actualUrl && art.image_url && art.image_url.includes('http')) {
                                actualUrl = art.image_url;
                                // clear image_url so it fetches a real image
                                art.image_url = ''; 
                            }
                            art.url = actualUrl;

                            // If metadata is missing, fetch it
                            if (needsMetadata && art.url) {
                                KatakitaAPI.request('fetch_article_metadata', {
                                    url: art.url,
                                    article_id: art.id
                                })
                                    .then(metaResponse => {
                                        console.log('Fetched metadata for', art.url, metaResponse);
                                        if (metaResponse && metaResponse.result === 'success') {
                                            // Only update if it wasn't an error fetch
                                            if (metaResponse.data.title !== 'Error loading article') {
                                                art.title = art.title || metaResponse.data.title;
                                                art.summary = art.summary || metaResponse.data.summary;
                                                art.image_url = art.image_url || metaResponse.data.image_url;
                                            }
                                            renderArticleCard(art);
                                        } else {
                                            renderArticleCard(art);
                                        }
                                    })
                                    .catch(() => {
                                        // If fetch fails, still render with empty metadata
                                        renderArticleCard(art);
                                    });
                            } else {
                                renderArticleCard(art);
                            }
                        });

                        function renderArticleCard(art) {
                            const urlCandidates = [art.url, art.URL, art.link, art.Link, art.href, art.HREF];
                            const link = urlCandidates.find(u => typeof u === 'string' && u.trim().length > 0) || '#';
                            const title = art.title || 'Untitled Article';
                            const summary = art.summary || '';
                            const imageUrl = art.image_url || '';
                            // Build image HTML
                            let imageHTML = '';
                            if (imageUrl) {
                                imageHTML = `<img src="${imageUrl}" alt="${title}" style="width: 100%; height: 100%; object-fit: cover;">`;
                            } else {
                                imageHTML = `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>`;
                            }
                            const card = document.createElement('a');
                            card.className = 'card article-card';
                            card.href = link;
                            card.target = '_blank';
                            card.rel = 'noopener noreferrer';
                            card.addEventListener('click', (e) => {
                                if (typeof AppState !== 'undefined') {
                                    if (typeof AppState.addPoints === 'function') {
                                        AppState.addPoints(5);
                                    }
                                    if (typeof AppState.checkAndCompleteTask === 'function') {
                                        AppState.checkAndCompleteTask('education');
                                    }
                                }
                                // default navigation via href proceeds automatically
                            });
                            card.innerHTML = `
    <div class="article-image" style="position: relative; width: 100%; height: 200px; overflow: hidden; border-radius: 8px 8px 0 0;">
        ${imageHTML}
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:15px; background:rgba(0,0,0,0.6); color:#fff; transition:background 0.3s;">
            <h3 style="margin:0; font-size:1.1rem; line-height:1.2; text-align:center;">${title}</h3>
        </div>
    </div>
    <div class="article-content" style="padding: 15px;">
        <p class="article-summary" style="margin:0; font-size:0.9rem; color: var(--color-text-muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">
            ${summary}
        </p>
    </div>
`;
                            grid.appendChild(card);
                        }
                    } else {
                        grid.innerHTML = '<p style="text-align: center; color: var(--color-text-muted); grid-column: 1 / -1; padding: 40px;">No articles yet.</p>';
                    }
                })
                .catch(err => {
                    console.error('Error fetching articles:', err);
                    grid.innerHTML = '<p style="text-align: center; color: var(--color-text-muted); grid-column: 1 / -1; padding: 40px;">Error loading articles.</p>';
                });
        });
    </script>
