<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KATA-KITA</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="js/main.js" defer></script>
    <style>
        /* Specific Styles for Login Landing */
        body {
            background: linear-gradient(135deg, var(--color-bg-primary) 0%, var(--color-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            opacity: 0.98;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 56px 48px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
            border: 1px solid var(--color-border);
            transition: all var(--transition-speed) ease;
        }

        .index-theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            background: var(--card-bg);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            color: var(--color-text-main);
            border: 1px solid var(--color-border);
            transition: all var(--transition-speed) ease;
        }

        .index-theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .logo-mark {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            transform: rotate(-10deg);
            box-shadow: 0 10px 20px rgba(233, 59, 129, 0.2);
        }

        .logo-mark svg {
            color: white;
            width: 32px;
            height: 32px;
            transform: rotate(10deg);
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--color-text-main);
            letter-spacing: -0.5px;
        }

        .login-title span {
            color: var(--color-primary);
        }

        .login-subtitle {
            color: var(--color-text-muted);
            margin-bottom: 32px;
            font-size: 1.05rem;
        }

        .login-form {
            text-align: left;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 12px;
            border-radius: 14px;
        }

        /* Abstract Floating Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.6;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--color-primary);
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: var(--color-accent);
            bottom: -50px;
            right: -50px;
        }
    </style>
</head>

<body>

    <!-- Theme Toggle -->
    <div class="index-theme-toggle theme-toggle-btn" title="Toggle Theme">
        <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </div>

    <!-- Background Decoration -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="login-wrapper">
        <div class="login-card animate-fade-in">
            <div class="logo-mark">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </div>
            <h1 class="login-title">KATA-<span>KITA</span></h1>
            <p class="login-subtitle">A safe space to share and grow.</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Nickname (Anonymous in public)</label>
                    <input type="text" id="username" placeholder="e.g. Sunflower" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary login-btn">Enter Space</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const username = usernameInput.value.trim();

            if (username.length > 0) {
                // Save user and init points if first time
                localStorage.setItem('katakita_user', username);
                if (!localStorage.getItem('katakita_points')) {
                    localStorage.setItem('katakita_points', '0');
                }

                // Add tiny animation delay
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = 'pages/beranda.html';
                }, 300);
            }
        });
    </script>
</body>

</html>
